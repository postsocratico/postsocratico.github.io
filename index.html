<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noeta | Coming Soon</title>
    <style>
        /* CSS Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #050505; /* Deep minimalistic black */
            color: #ffffff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Canvas Background for Graph Theory Theme */
        #graph-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.6;
        }

        /* Content Container */
        .landing-container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
            max-width: 800px;
            pointer-events: none; /* Lets clicks pass through to canvas if interactive */
        }

        /* Typography */
        h1 {
            font-size: 4.5rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 1rem;
            color: #f8f9fa;
        }

        .subtitle {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            color: #a1a1aa; /* Muted gray for minimalism */
            line-height: 1.6;
            margin-bottom: 2.5rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .divider {
            width: 40px;
            height: 2px;
            background-color: #4b5563;
            margin: 0 auto 2.5rem auto;
        }

        .status {
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #ffffff;
            border: 1px solid #3f3f46;
            padding: 0.75rem 1.5rem;
            display: inline-block;
            border-radius: 2px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
        }

        /* Responsive Adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            .subtitle { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <canvas id="graph-canvas"></canvas>

    <div class="landing-container">
        <h1>Noeta</h1>
        <p class="subtitle">Venture Capital & IT Data Infrastructure.<br>Empowering regional policy through deterministic data services.</p>
        <div class="divider"></div>
        <div class="status">System Under Construction</div>
    </div>

    <script>
        const canvas = document.getElementById('graph-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let nodes = [];
        
        // Configuration
        const connectionDistance = 150; // Max distance to draw an edge
        const nodeCount = 80;           // Number of vertices
        const nodeSpeed = 0.4;          // Drift speed

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Node {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * nodeSpeed;
                this.vy = (Math.random() - 0.5) * nodeSpeed;
                this.radius = Math.random() * 1.5 + 0.5;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off edges
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#71717a'; 
                ctx.fill();
            }
        }

        function init() {
            resize();
            nodes = [];
            // Scale node count based on screen size for mobile performance
            const adjustedNodeCount = window.innerWidth < 768 ? nodeCount / 2 : nodeCount;
            for (let i = 0; i < adjustedNodeCount; i++) {
                nodes.push(new Node());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            // Update and draw nodes
            for (let i = 0; i < nodes.length; i++) {
                nodes[i].update();
                nodes[i].draw();

                // Check connections (edges)
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        
                        // Opacity based on distance
                        const opacity = 1 - (distance / connectionDistance);
                        ctx.strokeStyle = `rgba(113, 113, 122, ${opacity * 0.5})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            init(); // Reinitialize to distribute nodes properly
        });

        init();
        animate();
    </script>
</body>
</html>
